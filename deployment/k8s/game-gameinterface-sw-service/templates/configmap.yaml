apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameinterface-sw-service.fullname" . }}
  labels:
    {{- include "game-gameinterface-sw-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
        "Kestrel": {
          "EndpointDefaults": {
                "Protocols": "Http2"
          },
          "Endpoints": {
            "HealthCheck": {
                "Url": "http://*:{{ .Values.service.port }}",
                "Protocols": "Http1"
            },
            "Grpc": {
                "Url": "http://*:{{ .Values.servicegrpc.port }}"
            }
          }
        },
        "DistributedLockSettings": {
          "LockPrefixKey": "gp.gameinterface:skywind:",
          "LockMinutes": 1
        },
        "GameInterfaceSetting": {
          "NatsSetting": {
            "Accesstoken": {
              "Subject": "gp.gameinterface.skywind.accesstoken",
              "Group": "gp.gameinterface.skywind"
            }
          },
          "CurrencyMappings": [
            {
              "CurrencyCode": "CNY",
              "CountryCode": "CN",
              "LanguageCode": "zh-cn",
              "DisplayName": "China"
            },
            {
              "CurrencyCode": "IDR",
              "CountryCode": "ID",
              "LanguageCode": "en",
              "DisplayName": "Indonesia"
            },
            {
              "CurrencyCode": "INR",
              "CountryCode": "IN",
              "LanguageCode": "en",
              "DisplayName": "India"
            },
            {
              "CurrencyCode": "MYR",
              "CountryCode": "MY",
              "LanguageCode": "en",
              "DisplayName": "Malaysia"
            },
            {
              "CurrencyCode": "THB",
              "CountryCode": "TH",
              "LanguageCode": "en",
              "DisplayName": "Thailand"
            },
            {
              "CurrencyCode": "VND",
              "CountryCode": "VN",
              "LanguageCode": "en",
              "DisplayName": "Vietnam"
            }
          ]
        }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
