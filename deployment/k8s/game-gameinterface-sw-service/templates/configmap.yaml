apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameinterface-sw-service.fullname" . }}
  labels:
    {{- include "game-gameinterface-sw-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Microsoft.AspNetCore": "Warning",
          "Tgs.GameInterface.SkywindService.Core": "Information"
        }
      },
      "Kestrel": {
        "EndpointDefaults": {
          "Protocols": "Http2"
        },
        "Endpoints": {
          "Http": {
            "Url": "http://*:{{ .Values.service.targetPort }}",
            "Protocols": "Http1"
          },
          "Grpc": {
            "Url": "http://*:{{ .Values.service.grpc.targetPort }}",
            "Protocols": "Http2"
          }
        }
      },
      "DistributedLockSettings": {
        "LockPrefixKey": "gp.gameinterface:skywind:",
        "LockMinutes": 1
      },
      "GameInterfaceSetting": {
        "NatsSetting": {
          "Accesstoken": {
            "Subject": "gp.gameinterface.skywind.accesstoken",
            "Group": "gp.gameinterface.skywind"
          }
        },
        "CurrencyMappings": [
          {
            "CurrencyCode": "CNY",
            "CountryCode": "CN",
            "LanguageCode": "zh-cn",
            "DisplayName": "China"
          },
          {
            "CurrencyCode": "IDR",
            "CountryCode": "ID",
            "LanguageCode": "en",
            "DisplayName": "Indonesia"
          },
          {
            "CurrencyCode": "INR",
            "CountryCode": "IN",
            "LanguageCode": "en",
            "DisplayName": "India"
          },
          {
            "CurrencyCode": "MYR",
            "CountryCode": "MY",
            "LanguageCode": "en",
            "DisplayName": "Malaysia"
          },
          {
            "CurrencyCode": "THB",
            "CountryCode": "TH",
            "LanguageCode": "en",
            "DisplayName": "Thailand"
          },
          {
            "CurrencyCode": "VND",
            "CountryCode": "VN",
            "LanguageCode": "en",
            "DisplayName": "Vietnam"
          }
        ]
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]