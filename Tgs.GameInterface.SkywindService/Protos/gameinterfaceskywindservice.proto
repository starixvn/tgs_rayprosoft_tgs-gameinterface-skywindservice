syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.SkywindService.Protos";

package gameinterfaceskywindservice;

// The greeting service definition.
service GameInterfaceSkywindService {
  // Sends a greeting
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (FundStatusReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecordBySettle (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecord3rdParty (GameRecordRequest) returns (GameRecordReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerBalanceRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	string player_code = 5;
	
}

message PlayerCreateRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	string player_code = 5;
	string currency = 6;
}

message FundRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	string ext_trx_id = 5;
	string player_code = 6;
	string currency = 7;
	phoenix.protobuf.DecimalValue amount = 8;
}

message FundStatusRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	string ext_trx_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	string player_code = 5;
	string game_code = 6;
	string language = 7;
}

message GameRecordRequest {
	string api_url = 1;
	string secret_key = 2;
	string username = 3;
	string password = 4;
	google.protobuf.Timestamp start = 5; 
	google.protobuf.Timestamp end = 6;
	int32 offset = 7;
	int32 limit = 8;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}
message PlayerBalanceReply {
	bool is_player = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	bool status = 1;
	string trx_id = 2;
    string ext_trx_id = 3;
    string order_status = 4;
    phoenix.protobuf.DecimalValue amount = 5;
    phoenix.protobuf.DecimalValue balance = 6;
}

message FundStatusReply {
	bool is_transaction = 1;
	string status = 2;
}

message GameUrlReply {
	bool is_player = 1;
	string game_url = 2;
}

message GameRecordReply {
	repeated GameRecord items = 1;
}

message GameRecord {
	string player_code = 1;
	string external_round_id = 2;
    string external_game_id = 3;
	bool finished = 4;
	google.protobuf.Timestamp external_created_on = 5; 
	google.protobuf.Timestamp external_closed_on = 6;
    phoenix.protobuf.DecimalValue bet = 7;
	phoenix.protobuf.DecimalValue valid_bet = 8;
	phoenix.protobuf.DecimalValue player_winLoss = 9;
    phoenix.protobuf.DecimalValue turnover = 10;
    phoenix.protobuf.DecimalValue settle = 11;
    string additional_data = 12;
}

message CheckingServiceReply{
    string machine_name = 1;
}